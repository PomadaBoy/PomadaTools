title: "Outline\nCheck"
tooltip: Run in the plan with the DWG. Compares element footprints (e.g. Generic Model extrusions) with closed DWG outlines both ways. Creates the plan 'QAQC Outline Check - <plan>' - green OK, yellow check, red deviates, purple duplicate, orange no DWG - with red/magenta markers where outlines deviate, DWG outlines without an element, and a table with deviations, shift and areas.
author: Slobodan Vesovic
